[project]
name = "speechlab-ai-backend"
version = "0.2.0"
description = "SpeechLab AI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.0",
  "av>=14.0.0",
  "pymongo>=4.11.0",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0", "httpx>=0.28.0"]
